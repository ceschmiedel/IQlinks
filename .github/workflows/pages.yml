name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - claude/affiliate-marketplace-scraper-sqrg09
  workflow_dispatch:

# Publica na branch gh-pages: em repositório público o GitHub habilita o
# Pages automaticamente para essa branch, sem passo manual nas Settings
# (o método via actions/deploy-pages exige criar o site pela API, que o
# GITHUB_TOKEN padrão não tem permissão de fazer).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O site é o frontend + os módulos ES compartilhados que o modo
      # estático importa no navegador (ranking, formatação, fontes sem
      # segredo). Nada de src/server.js, shopee.js ou store.js: esses
      # dependem de Node/segredos e só existem no modo servidor.
      - name: Montar site estático
        run: |
          mkdir -p _site/src/sources _site/src/dispatch
          cp public/index.html _site/
          cp src/offer.js src/score.js src/format.js _site/src/
          cp src/sources/mock.js src/sources/mercadolivre.js _site/src/sources/
          cp src/dispatch/telegram.js _site/src/dispatch/
          touch _site/.nojekyll

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
