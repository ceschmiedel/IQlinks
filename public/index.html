<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQlinks — ofertas com maior potencial</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔗%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6ea;
    --text: #1c2733; --muted: #66707c;
    --accent: #0e7a5f; --accent-soft: #e2f3ee;
    --warn: #9a6700; --warn-soft: #fff3d6;
    --danger: #b3261e;
    --shadow: 0 1px 3px rgba(16, 24, 32, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d; --surface: #1d232a; --border: #2c343d;
      --text: #e8ebee; --muted: #98a2ad;
      --accent: #4cc3a0; --accent-soft: #1b3a32;
      --warn: #e3b341; --warn-soft: #3a3320;
      --danger: #f2867f;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 96px;
  }
  header {
    padding: 20px 24px 0; max-width: 1100px; margin: 0 auto;
  }
  header h1 { margin: 0; font-size: 22px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .toolbar {
    max-width: 1100px; margin: 16px auto 0; padding: 0 24px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; min-width: 0;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    background: var(--surface); color: var(--text);
    padding: 8px 14px; font-size: 14px; font-weight: 500;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0c1512; } }

  #status { max-width: 1100px; margin: 12px auto 0; padding: 0 24px; color: var(--muted); font-size: 14px; }

  .grid {
    max-width: 1100px; margin: 16px auto; padding: 0 24px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px; cursor: pointer;
  }
  .card.selected { outline: 2px solid var(--accent); }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .score {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  }
  .score .bar {
    width: 90px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden;
  }
  .score .bar i { display: block; height: 100%; background: var(--accent); }
  .score b { color: var(--text); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.plain { background: var(--bg); color: var(--muted); font-weight: 500; }
  .card h3 { margin: 0; font-size: 15px; line-height: 1.35; }
  .card .shop { color: var(--muted); font-size: 13px; }
  .price { display: flex; align-items: baseline; gap: 8px; }
  .price .now { font-size: 20px; font-weight: 700; }
  .price .old { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .meta { color: var(--muted); font-size: 13px; }
  .card .actions { display: flex; gap: 8px; margin-top: auto; }
  .card .actions button { font-size: 13px; padding: 6px 10px; flex: 1; }
  .linkbox {
    font-size: 12px; color: var(--muted); word-break: break-all;
    background: var(--bg); border-radius: 6px; padding: 6px 8px;
  }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 24px; display: none;
  }
  #bar.visible { display: block; }
  #bar .inner {
    max-width: 1100px; margin: 0 auto;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  #bar .count { font-weight: 600; margin-right: auto; }
  #preview {
    max-width: 1100px; margin: 0 auto 10px; display: none;
  }
  #preview.visible { display: block; }
  #preview textarea {
    width: 100%; height: 180px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font: 13px/1.5 ui-monospace, monospace;
  }

  #toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 90vw; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 48px 24px; grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <h1>IQ<span>links</span></h1>
  <p>Anúncios com maior potencial de venda, prontos para compartilhar com seu link de afiliado.</p>
</header>

<div class="toolbar">
  <div class="field">
    <label for="source">Fonte</label>
    <select id="source">
      <option value="mock">Demo (sem credenciais)</option>
      <option value="shopee">Shopee</option>
      <option value="mercadolivre">Mercado Livre</option>
    </select>
  </div>
  <div class="field" style="flex:1; min-width:160px">
    <label for="keyword">Busca (opcional)</label>
    <input id="keyword" placeholder="ex.: fone bluetooth">
  </div>
  <div class="field" style="width:90px">
    <label for="limit">Coletar</label>
    <input id="limit" type="number" value="50" min="1" max="100">
  </div>
  <div class="field" style="width:170px">
    <label for="subid">Sub-ID (grupo/campanha)</label>
    <input id="subid" placeholder="ex.: grupo-ofertas-1">
  </div>
  <button class="primary" id="search">Buscar ofertas</button>
</div>

<div id="status"></div>
<div class="grid" id="grid">
  <div class="empty">Clique em “Buscar ofertas” para começar. A fonte Demo funciona sem nenhuma credencial.</div>
</div>

<div id="bar">
  <div id="preview"><textarea id="previewText" readonly></textarea></div>
  <div class="inner">
    <span class="count" id="count"></span>
    <button id="togglePreview">Ver mensagens</button>
    <button id="copy">📋 Copiar</button>
    <button id="whatsapp">🟢 WhatsApp</button>
    <button id="telegram">✈️ Telegram</button>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const int = new Intl.NumberFormat('pt-BR');

let offers = [];
const selected = new Set(); // itemIds

function toast(msg, isError = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.className = ''), 3500);
}

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

async function search() {
  const btn = $('search');
  btn.disabled = true;
  $('status').textContent = 'Coletando e ranqueando ofertas...';
  selected.clear();
  try {
    const params = new URLSearchParams({
      source: $('source').value,
      keyword: $('keyword').value,
      limit: $('limit').value,
    });
    const data = await api(`/api/offers?${params}`);
    offers = data.offers;
    $('status').textContent =
      `${offers.length} ofertas, ordenadas por potencial de venda. ` +
      `Ofertas enviadas nos últimos ${data.dedupeDays} dias aparecem marcadas.`;
    render();
  } catch (err) {
    $('status').textContent = '';
    $('grid').innerHTML = '<div class="empty">Nenhuma oferta carregada.</div>';
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    updateBar();
  }
}

function render() {
  const grid = $('grid');
  grid.innerHTML = '';
  if (offers.length === 0) {
    grid.innerHTML = '<div class="empty">Nenhuma oferta encontrada.</div>';
    return;
  }
  const maxScore = Math.max(...offers.map((o) => o.score), 0.0001);

  for (const o of offers) {
    const card = document.createElement('div');
    card.className = 'card' + (selected.has(o.itemId) ? ' selected' : '');

    const pct = Math.round((o.score / maxScore) * 100);
    const badges = [];
    if (o.commissionRate > 0)
      badges.push(`<span class="badge">${(o.commissionRate * 100).toFixed(0)}% comissão</span>`);
    if (o.discountRate > 0)
      badges.push(`<span class="badge plain">-${Math.round(o.discountRate * 100)}%</span>`);
    badges.push(o.isAffiliateLink
      ? '<span class="badge">✅ link de afiliado</span>'
      : '<span class="badge warn">⚠️ link comum</span>');
    if (o.sentRecently)
      badges.push('<span class="badge warn">já enviado</span>');

    const metaParts = [];
    if (o.sales > 0) metaParts.push(`🛒 ${int.format(o.sales)} vendidos`);
    if (o.rating > 0) metaParts.push(`⭐ ${o.rating.toFixed(1)}`);

    card.innerHTML = `
      <div class="top">
        <div class="score">
          <span>Potencial</span>
          <span class="bar"><i style="width:${pct}%"></i></span>
          <b>${pct}</b>
        </div>
        <input type="checkbox" ${selected.has(o.itemId) ? 'checked' : ''} aria-label="Selecionar oferta">
      </div>
      <div class="badges">${badges.join('')}</div>
      <h3></h3>
      <div class="shop"></div>
      <div class="price">
        <span class="now">${brl.format(o.price)}</span>
        ${o.originalPrice ? `<span class="old">${brl.format(o.originalPrice)}</span>` : ''}
      </div>
      <div class="meta">${metaParts.join(' · ')}</div>
      <div class="linkbox"></div>
      <div class="actions">
        <button data-act="shortlink" ${o.source === 'mercadolivre' ? 'disabled title="ML não tem API aberta de afiliados — gere o link no painel"' : ''}>🔗 Gerar shortlink</button>
        <button data-act="copylink">Copiar link</button>
      </div>`;

    card.querySelector('h3').textContent = o.title;
    card.querySelector('.shop').textContent = o.shopName || '';
    card.querySelector('.linkbox').textContent = o.link;

    card.addEventListener('click', (ev) => {
      if (ev.target.closest('button') || ev.target.closest('.linkbox')) return;
      toggleSelect(o, card);
    });
    card.querySelector('input[type=checkbox]').addEventListener('click', (ev) => {
      ev.stopPropagation();
      toggleSelect(o, card);
    });
    card.querySelector('[data-act=copylink]').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await navigator.clipboard.writeText(o.link);
      toast('Link copiado.');
    });
    card.querySelector('[data-act=shortlink]').addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const btn = ev.target;
      btn.disabled = true;
      try {
        const subId = $('subid').value.trim();
        const data = await api('/api/shortlink', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: o.source, originUrl: o.link, subIds: subId ? [subId] : [] }),
        });
        o.message = o.message.replaceAll(o.link, data.shortLink);
        o.link = data.shortLink;
        o.isAffiliateLink = true;
        render();
        updateBar();
        toast('Shortlink gerado.');
      } catch (err) {
        toast(err.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    grid.appendChild(card);
  }
}

function toggleSelect(o, card) {
  if (selected.has(o.itemId)) selected.delete(o.itemId);
  else selected.add(o.itemId);
  card.classList.toggle('selected', selected.has(o.itemId));
  card.querySelector('input[type=checkbox]').checked = selected.has(o.itemId);
  updateBar();
}

const selectedOffers = () => offers.filter((o) => selected.has(o.itemId));
const combinedText = () => selectedOffers().map((o) => o.message).join('\n\n');

function updateBar() {
  const n = selected.size;
  $('bar').classList.toggle('visible', n > 0);
  $('count').textContent = `${n} oferta${n > 1 ? 's' : ''} selecionada${n > 1 ? 's' : ''}`;
  if (n > 0) $('previewText').value = combinedText();
}

async function markSent() {
  const sent = selectedOffers();
  try {
    await api('/api/mark-sent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ offers: sent }),
    });
    for (const o of sent) o.sentRecently = true;
    selected.clear();
    render();
    updateBar();
  } catch {
    // dedupe é conveniência; não bloqueia o fluxo de compartilhamento
  }
}

$('search').addEventListener('click', search);
$('keyword').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') search(); });

$('togglePreview').addEventListener('click', () => {
  const p = $('preview');
  p.classList.toggle('visible');
  $('togglePreview').textContent = p.classList.contains('visible') ? 'Ocultar mensagens' : 'Ver mensagens';
});

$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(combinedText());
  toast('Mensagens copiadas — cole no grupo do WhatsApp. Marcadas como enviadas.');
  await markSent();
});

$('whatsapp').addEventListener('click', async () => {
  // Fluxo semiautomático: abre o WhatsApp com a mensagem pronta e o usuário
  // escolhe o grupo. A API oficial não posta em grupos e clientes não
  // oficiais arriscam banimento do número.
  window.open(`https://wa.me/?text=${encodeURIComponent(combinedText())}`, '_blank');
  toast('WhatsApp aberto — escolha o grupo e envie. Marcadas como enviadas.');
  await markSent();
});

$('telegram').addEventListener('click', async () => {
  const btn = $('telegram');
  btn.disabled = true;
  try {
    const data = await api('/api/share/telegram', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ offers: selectedOffers() }),
    });
    toast(`${data.sent} mensagem(ns) enviadas ao Telegram.`);
    await markSent();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
